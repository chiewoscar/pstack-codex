name: Check package

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python scripts/check_package.py
      - run: bun install --frozen-lockfile
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: bun test watch-pr
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: bun run typecheck
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - if: runner.os == 'Linux'
        run: bun test orch
        working-directory: plugins/pstack-codex/skills/poteto-mode/scripts
      - run: node --disable-warning=ExperimentalWarning --test test/chart.test.ts test/messages.test.ts test/pipeline.test.ts
        working-directory: plugins/pstack-codex/skills/statechart/scripts
      - run: python scripts/check_statechart.py
